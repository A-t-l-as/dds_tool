name: Release

# Push a tag like v3.0.0 to build the programs for all systems and publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir dist
          for target in windows/amd64/windows-x64.exe windows/arm64/windows-arm64.exe \
                        darwin/arm64/macos-arm64 darwin/amd64/macos-x64 \
                        linux/amd64/linux-x64 linux/arm64/linux-arm64; do
            IFS=/ read -r goos goarch name <<< "$target"
            GOOS=$goos GOARCH=$goarch go build -trimpath \
              -ldflags "-s -w -X main.Version=$version" -o "dist/dds_tool-$name" .
          done
          cd dist && sha256sum * > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "dds_tool $GITHUB_REF_NAME" --generate-notes
